<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - History Stage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="calculator">
      <header>
        <div>
          <p class="eyebrow">Sankalp Tech Club</p>
          <h1>Calculator</h1>
        </div>
        <button id="historyToggle" class="icon-btn" aria-label="Toggle history">History</button>
      </header>

      <div class="display">
        <div class="expression">History module ready</div>
        <div class="result">0</div>
      </div>

      <div class="placeholder">
        <p>Calculation buttons will be added in Commit 2.</p>
      </div>
    </section>

    <aside class="history-panel" id="historyPanel">
      <div class="history-head">
        <div>
          <p class="eyebrow">Commit 1</p>
          <h2>History</h2>
        </div>
        <button id="clearHistory">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
