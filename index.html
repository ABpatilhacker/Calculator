<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101725">
  <title>NovaCalc | Smart Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <main class="app-shell">
    <section class="calculator">
      <header>
        <div>
          <p class="eyebrow">Sankalp Tech Club • Final</p>
          <h1>NovaCalc</h1>
        </div>
        <button id="historyToggle" class="icon-btn" aria-label="Toggle calculation history">History</button>
      </header>

      <div class="display">
        <div id="expression" class="expression">Ready</div>
        <div id="result" class="result">0</div>
      </div>

      <div class="keys">
        <button data-action="clear" class="utility">AC</button>
        <button data-action="delete" class="utility">DEL</button>
        <button data-action="sign" class="utility">±</button>
        <button data-value="/" class="operator">÷</button>

        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value="*" class="operator">×</button>
        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value="-" class="operator">−</button>
        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="+" class="operator">+</button>
        <button data-value="%">%</button><button data-value="0">0</button><button data-value=".">.</button><button data-action="equals" class="equals">=</button>
      </div>

      <p class="keyboard-note">Keyboard supported: 0–9, +, −, ×, ÷, Enter, Backspace, Esc</p>
    </section>

    <aside class="history-panel" id="historyPanel">
      <div class="history-head">
        <div><p class="eyebrow">Saved locally</p><h2>History</h2></div>
        <button id="clearHistory" class="clear-btn">Clear all</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
